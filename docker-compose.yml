# Postgres 16 + pgvector pour la Phase 2 (et l'API de la Phase 5).
#   docker compose up -d        # démarre et crée le schéma (db/init.sql) au premier lancement
#   docker compose down -v      # arrête ET supprime les données
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}     # mot de passe de dev local uniquement
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"          # lié à localhost : non exposé au réseau
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
